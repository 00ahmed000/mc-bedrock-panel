name: bedrock-panel

services:
  # ---------------------------------------------------------------------
  # FastAPI management engine. Not published to the host directly — the
  # ONLY way in is through nginx. Mounts the Docker socket so it can
  # create/control minecraft server containers and the sftp container.
  #
  # MUST stay a single process (no --workers > 1, no multiple replicas):
  # the in-process task scheduler (see backend/app/scheduler.py) would
  # otherwise run once per worker and fire every scheduled backup/restart
  # that many times over.
  # ---------------------------------------------------------------------
  backend:
    build: ./backend
    container_name: bedrock_backend
    restart: always
    env_file:
      - .env
    environment:
      - SERVERS_ROOT=/servers
      - BACKUP_PATH=/backups
      - SFTP_CONFIG_PATH=/sftp_config
      - BACKEND_CONTAINER_NAME=bedrock_backend
      - SFTP_CONTAINER_NAME=bedrock_sftp
      - MINECRAFT_IMAGE=bedrock-panel-minecraft:latest
      - DOCKER_NETWORK=bedrock-panel_internal
      - TZ=${TZ:-UTC}
    volumes:
      - servers_data:/servers
      - backups_data:/backups
      - ./sftp:/sftp_config
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    depends_on:
      - sftp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # SFTP file access on a non-standard port. Mounts the WHOLE shared
  # servers_data volume once, so every current and future server (however
  # many get created later from the panel) is automatically browsable
  # under servers/<server-id>/ with no reconfiguration needed. Its ONLY
  # source of truth for credentials is the bind-mounted users.conf below
  # — see sftp/users.conf.example and README.md before first boot.
  # ---------------------------------------------------------------------
  sftp:
    image: atmoz/sftp:debian
    container_name: bedrock_sftp
    restart: always
    ports:
      - "${SFTP_PORT:-2222}:22"
    volumes:
      - servers_data:/home/${SFTP_USERNAME:-admin}/servers
      - ./sftp/users.conf:/etc/sftp/users.conf:ro
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------
  # Bedrock Dedicated Server image. Intentionally profile-gated so plain
  # `docker compose up -d` never starts a container from it directly —
  # the backend creates real, individually-named containers from this
  # same image on demand (see backend/app/docker_utils.py). Build it
  # explicitly once:
  #
  #   docker compose build minecraft
  # ---------------------------------------------------------------------
  minecraft:
    build:
      context: ./minecraft
      args:
        BEDROCK_UID: ${BEDROCK_UID:-1000}
        BEDROCK_GID: ${BEDROCK_GID:-1000}
    image: bedrock-panel-minecraft:latest
    profiles: ["build-only"]

  # ---------------------------------------------------------------------
  # Reverse proxy + static Vue build. This is the ONLY service exposed to
  # the host — everything else is reached through it.
  # ---------------------------------------------------------------------
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: bedrock_nginx
    restart: always
    ports:
      - "${PANEL_PORT:-80}:80"
    networks:
      - internal
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    name: bedrock-panel_internal
    driver: bridge

volumes:
  servers_data:
  backups_data:
